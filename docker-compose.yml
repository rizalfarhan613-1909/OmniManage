name: omnimanage

services:
  postgres:
    image: postgres:16
    container_name: omnimanage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnimanage_db
      POSTGRES_USER: omni_migrator
      POSTGRES_PASSWORD: Password123!
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - omnimanage_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_migrator -d omnimanage_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  omnimanage_postgres_data: